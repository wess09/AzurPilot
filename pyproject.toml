[project]
name = "azurpilot"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.0",
    "pillow==12.3.0",
    "opencv-python==5.0.0.93",
    "imageio==2.26.0",
    "imageio-ffmpeg==0.6.0",
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "wrapt==1.15.0",
    "retrying==1.3.4",
    "jellyfish==1.2.1",
    "pyyaml==6.0.3",
    "inflection==0.5.1",
    "pywebio==1.7.1",
    "starlette==1.3.1",
    "anyio==4.13.0",
    "uvicorn[standard]==0.44.0",
    "aiofiles==23.1.0",
    "aiohttp>=3.13.2",
    "aiortc>=1.14.0",
    "pypresence==4.2.1",
    "rich==11.2.0",
    "zerorpc==0.6.3",
    "pyzmq==27.1.0",
    "onepush==1.2.0",
    "psutil==7.2.2",
    "chardet==5.1.0",
    "matplotlib==3.11.0",
    "pycryptodome==3.23.0",
    "typing-extensions>=4.15.0",
    "pydantic>=2.12.5",
    "rapidocr==3.9.0",
    "ncnn>=1.0.20260114",
    "onnxruntime-windowsml==1.27.1.202607110137; sys_platform == 'win32'",
    "windowsml==2.1.74; sys_platform == 'win32'",
    "onnxruntime==1.27.0; sys_platform == 'linux'",
    "onnxruntime==1.27.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "watchdog>=6.0.0",
    "numba==0.66.0",
    "uv==0.10.2",
    "lz4==4.4.5",
    "packaging==24.2",
    "setuptools==75.8.2",
    "importlib-resources==6.0.0",
    "importlib-metadata==8.0.0",
    "openai==2.30.0",
    "mcp==1.23.0",
    "sse-starlette==3.0.3",
    "pygments==2.20.0",
    "pip==26.0.1",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
index = [
    # 云厂商镜像
    { url = "https://mirrors.aliyun.com/pypi/simple/" },
    { url = "https://mirrors.cloud.tencent.com/pypi/simple/" },
    { url = "https://repo.huaweicloud.com/repository/pypi/simple/" },
    # 教育网镜像
    { url = "https://mirrors.cernet.edu.cn/pypi/web/simple/" }, # CERNET 校园网联合镜像站
]
index-url = "https://pypi.org/simple/"
package = false
index-strategy = "unsafe-best-match"
override-dependencies = [
    # uiautomator2 2.16.17 declares packaging~=20.3, whose 20.9 release
    # imports the removed stdlib distutils module on Python 3.14.
    "packaging==24.2",
]

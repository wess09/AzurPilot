[project]
name = "azurpilot"
version = "0.0.0"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.0",
    "pillow==12.3.0",
    "opencv-python==5.0.0.93",
    "imageio==2.26.0",
    "imageio-ffmpeg==0.6.0",
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "jellyfish==1.2.1",
    "pyyaml==6.0.3",
    "inflection==0.5.1",
    "starlette==0.49.1",
    "anyio==4.13.0",
    "uvicorn[standard]==0.44.0",
    "flask==3.1.3",
    "aiohttp>=3.13.2",
    "aiortc>=1.14.0",
    "pypresence==4.2.1",
    "rich>=13.7.0",
    "zerorpc==0.6.3",
    "pyzmq==27.1.0",
    "onepush==1.2.0",
    "psutil==7.2.2",
    "matplotlib==3.11.0",
    "pycryptodome==3.23.0",
    "pydantic>=2.12.5",
    "rapidocr==3.9.0",
    "ncnn>=1.0.20260114",
    "onnxruntime-windowsml==1.27.1.202607110137; sys_platform == 'win32'",
    "windowsml==2.1.74; sys_platform == 'win32'",
    "onnxruntime==1.27.0; sys_platform == 'linux'",
    "onnxruntime==1.27.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numba==0.66.0",
    "uv==0.11.32",
    "lz4==4.4.5",
    "packaging==24.2",
    "openai==2.30.0",
    "mcp==1.23.0",
    "textual>=0.80.0",
    "cryptography>=49.0.0",
    "keyring>=25.6.0",
    "portalocker>=3.2.0",
    "openpyxl>=3.1.5,<4",
]

[dependency-groups]
dev = [
    "ruff",
    # tests/shop_event/ 使用 pytest 编写
    "pytest",
    # dev_tools 脚本依赖
    "pandas",
    "pyperclip",
]

[tool.uv]
index = [
    # 云厂商镜像
    { url = "https://mirrors.aliyun.com/pypi/simple/" },
    { url = "https://mirrors.cloud.tencent.com/pypi/simple/" },
    { url = "https://repo.huaweicloud.com/repository/pypi/simple/" },
    ]
index-url = "https://pypi.org/simple/"
package = false
index-strategy = "unsafe-best-match"
override-dependencies = [
    # uiautomator2 2.16.17 declares packaging~=20.3, whose 20.9 release
    # imports the removed stdlib distutils module on Python 3.14.
    "packaging==24.2",
]

[tool.pytest.ini_options]
# tests/ 不是包，pytest 需要仓库根目录在 sys.path 才能导入 module/
pythonpath = ["."]

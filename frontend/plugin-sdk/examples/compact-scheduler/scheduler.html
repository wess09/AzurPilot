<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舰桥调度器</title>
<style>
  :root {color-scheme:light dark; font:14px system-ui, sans-serif}
  body {margin:0; padding:16px}
  h2 {margin:0 0 12px; font-size:1rem}
  dl {display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  dt {font-size:.8rem}
  dd {margin:0; font-size:1.2rem; font-weight:600}
  button {min-height:32px; font:inherit}
</style>
<h2>舰桥调度器</h2>
<dl>
  <div><dt>运行中</dt><dd id="running">0</dd></div>
  <div><dt>待运行</dt><dd id="pending">0</dd></div>
  <div><dt>等待中</dt><dd id="waiting">0</dd></div>
</dl>
<button disabled>启动调度器</button>
<p role="status"></p>
<script type="module">
  import { request, subscribe } from './apu.js'
  const button = document.querySelector('button')
  const status = document.querySelector('[role="status"]')
  subscribe('appearance', ({mode}) => { document.documentElement.style.colorScheme = mode })
  subscribe('scheduler.state', ({isRunning, running, pending, waiting, disabled, busy}) => {
    for (const [id, value] of Object.entries({running, pending, waiting})) {
      document.getElementById(id).textContent = value
    }
    button.textContent = busy ? '处理中…' : isRunning ? '停止调度器' : '启动调度器'
    button.disabled = disabled
  })
  button.addEventListener('click', async () => {
    try { await request('scheduler.toggle'); status.textContent = '' }
    catch (error) { status.textContent = error.message }
  })
</script>
</html>

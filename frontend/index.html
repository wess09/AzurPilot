<!doctype html>
<html lang="zh-CN" data-motion-strength="strong">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e2c" />
    <meta name="description" content="AzurPilot" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // 隧道反代入口形如 /<peer_id>，不带尾斜杠时相对路径会丢掉前缀而打到服务端。
      // 只在单段路径（隧道入口形态）补斜杠；根路径、已带斜杠与多段路径一律不动。
      if (/^\/[^/]+$/.test(location.pathname)) {
        document.write('<base href="' + location.pathname + '/">');
      }
    </script>
    <script>
      // 应用挂载前按上次会话的记录预载主题样式，避免默认主题先闪现再被皮肤覆盖。
      // 插件停用或更新后旧链接会 404，应用挂载后写入的新记录会把缓存纠正回来。
      // 插件管理页保持中性外观，不在该页预载。
      try {
        if (!/^#\/plugins$/.test(location.hash)) {
          var apuCached = JSON.parse(localStorage.getItem('azurpilot.apu-styles') || 'null');
          if (apuCached && typeof apuCached.id === 'string' && typeof apuCached.revision === 'string') {
            Object.keys(apuCached.styles || {}).forEach(function (component) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './api/v1/plugins/' + apuCached.id + '/' + apuCached.revision + '/' +
                String(apuCached.styles[component]).split('/').map(encodeURIComponent).join('/') + '?component=' + component;
              document.head.appendChild(link);
            });
          }
        }
      } catch (error) { /* 缓存不可用时交给应用按正常流程加载。 */ }
    </script>
    <link rel="icon" type="image/webp" href="%BASE_URL%azurpilot.webp" />
    <title>AzurPilot</title>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yhqqveymur");
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>

<!doctype html>
<html lang="zh-CN" data-motion-strength="strong">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e2c" />
    <meta name="description" content="AzurPilot" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // 隧道反代入口形如 /<peer_id>，不带尾斜杠时相对路径会丢掉前缀而打到服务端。
      // 只在单段路径（隧道入口形态）补斜杠；根路径、已带斜杠与多段路径一律不动。
      if (/^\/[^/]+$/.test(location.pathname)) {
        document.write('<base href="' + location.pathname + '/">');
      }
    </script>
    <link rel="icon" type="image/webp" href="%BASE_URL%azurpilot.webp" />
    <title>AzurPilot</title>

      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yhqqveymur");
    </script>
  </head>

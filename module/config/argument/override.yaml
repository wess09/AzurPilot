# ==================== Alas ====================

Restart:
  Scheduler:
    Enable:
      type: state
      value: true
      option: [true]
      option_bold: [true]
    SuccessInterval: 0
    FailureInterval: 0
    ServerUpdate: 00:00

# ==================== Farm ====================

Main:
  Campaign:
    Event: campaign_main
Main2:
  Campaign:
    Event: campaign_main
Main3:
  Campaign:
    Event: campaign_main
GemsFarming:
  Campaign:
    Mode: normal
    UseClearMode: true
    UseFleetLock: true
    Use2xBook: false
    AmbushEvade: true
  StopCondition:
    RunCount: 0
    MapAchievement: non_stop
    StageIncrease: false
    GetNewShip: false
    ReachLevel: 0
  Fleet:
    FleetOrder:
      display: display
      value: fleet1_all_fleet2_standby
      option: [fleet1_all_fleet2_standby, fleet1_standby_fleet2_all]

ThreeOilLowCost:
  Scheduler:
    NextRun:
      - "00:00"
      - "12:00"
      - "18:00"
    Command: ThreeOilLowCost
    # SuccessInterval: 0
    # FailureInterval: 0
  Campaign:
    Mode: normal
    UseClearMode: true
    UseFleetLock: true
    Use2xBook: false
    AmbushEvade: true
  StopCondition:
    RunCount: 0
    MapAchievement: non_stop
    StageIncrease: false
    GetNewShip: false
    ReachLevel: 0
  Fleet:
    FleetOrder:
      display: display
      value: fleet1_all_fleet2_standby
      option: [fleet1_all_fleet2_standby, fleet1_standby_fleet2_all]

Ambush11:
  Campaign:
    ContinueAfterRestart: false
    Event:
      value: campaign_main
    Mode: normal
    UseClearMode: false
    UseFleetLock: true
    UseAutoSearch: false
    Use2xBook: false
    AmbushEvade: true
  StopCondition:
    RunCount: 0
    MapAchievement: non_stop
    StageIncrease: false
    GetNewShip: false
    ReachLevel: 0
  Fleet:
    FleetOrder:
      display: display
      value: fleet1_all_fleet2_standby
      option: [fleet1_all_fleet2_standby, fleet1_standby_fleet2_all]
  Submarine:
    Mode:
      display: display
      value: do_not_use
      option: [do_not_use, hunt_only]
    AutoSearchMode: sub_standby
    DistanceToBoss: use_open_ocean_support
  Emotion:
    # 心情模式由「更换前排」在运行时决定，隐藏选择器避免与换船/等待策略冲突。
    Mode: calculate_ignore
  GemsFarming:
    EventFallbackStage: '0'
    VanguardLevelMin: 1
    VanguardLevelMax: 28


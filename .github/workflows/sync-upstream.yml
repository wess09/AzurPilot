name: Sync Upstream

on:
  schedule:
    # 每半小时运行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          # ⚠️ 请填写：上游仓库的完整 HTTPS 地址（只读，不影响上游）
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream/master into your master
        run: |
          git checkout master
          git merge upstream/master --ff-only
        continue-on-error: false

      - name: Push changes to your fork
        run: git push origin master

  notify:
    runs-on: ubuntu-latest
    needs: sync
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ⚠️ GitHub Actions 同步失败 - ${{ github.repository }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            定时同步任务失败，请检查日志。

            仓库：${{ github.repository }}
            工作流：${{ github.workflow }}
            运行 ID：${{ github.run_id }}
            分支：${{ github.ref_name }}
            Commit：${{ github.sha }}
            
            查看详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
